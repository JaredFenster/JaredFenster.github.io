<body class="project-page">
  <div data-include="partials/nav.html"></div>

  <main class="gallery-page">
    <header class="gallery-head">
      <h1 class="gallery-title">Gallery</h1>
      <p class="gallery-sub">Builds, parts and work in progress — <span id="galleryCount"></span> photos.</p>
    </header>

    <div class="gallery-rows" id="gallery"></div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <img class="lightbox__img" id="lightboxImg" alt="" />

    <div class="lightbox__bar">
      <span class="lightbox__count" id="lightboxCount"></span>
      <button class="lb-btn" id="lightboxClose" type="button" aria-label="Close viewer">&#10005;</button>
    </div>

    <button class="lb-btn lightbox__nav lightbox__nav--prev" id="lightboxPrev" type="button" aria-label="Previous photo">&#8249;</button>
    <button class="lb-btn lightbox__nav lightbox__nav--next" id="lightboxNext" type="button" aria-label="Next photo">&#8250;</button>
  </div>

      ["IMG_4076.JPEG", "IMG_4076.JPEG.jpg", 1536, 2048],
      ["IMG_4082.JPEG", "IMG_4082.JPEG.jpg", 1536, 2048],
      ["IMG_4131.JPEG", "IMG_4131.JPEG.jpg", 2048, 1536],
      ["J3Internal.png", "J3Internal.png.jpg", 813, 659],
      ["Joint.png", "Joint.png.jpg", 990, 754],
      ["ROS.png", "ROS.png.jpg", 1005, 798],
      ["Vis.png", "Vis.png.jpg", 481, 446],
      ["car.png", "car.png.jpg", 708, 618],
      ["result.JPEG", "result.JPEG.jpg", 3024, 2962]
    ];

    const FULL_DIR  = "assets/gallery/";
    const THUMB_DIR = "assets/gallery/thumbs/";

    const gallery  = document.getElementById("gallery");
    const countEl  = document.getElementById("galleryCount");
    const lightbox = document.getElementById("lightbox");
    const lbImg    = document.getElementById("lightboxImg");
    const lbCount  = document.getElementById("lightboxCount");
    const lbClose  = document.getElementById("lightboxClose");
    const lbPrev   = document.getElementById("lightboxPrev");
    const lbNext   = document.getElementById("lightboxNext");

    countEl.textContent = PHOTOS.length;

    const items = PHOTOS.map(([file, thumb, w, h], i) => ({
      thumb: THUMB_DIR + encodeURIComponent(thumb),
      full:  FULL_DIR  + encodeURIComponent(file),
      aspect: w / h,
      index: i
    }));

    const px = (el, name, fallback) => {
      const v = parseFloat(getComputedStyle(el).getPropertyValue(name));
      return Number.isFinite(v) ? v : fallback;
    };

    // ---- justified rows -------------------------------------------------
    // Photos are packed in order; a row commits once its natural height has
    // shrunk to the target. Widths use flex-grow proportional to aspect so a
    // row always fills the container exactly, whatever the rounding.
    function layout() {
      const width = gallery.clientWidth;
      if (!width) return;

      const gap    = px(gallery, "--gap", 14);
      const target = px(gallery, "--row-target", 400);

      const frag = document.createDocumentFragment();
      let row = [];
      let sumAspect = 0;

      const commit = (isPartial) => {
        if (!row.length) return;
        const rowEl = document.createElement("div");
        rowEl.className = "gallery-row" + (isPartial ? " gallery-row--partial" : "");

        const height = isPartial
          ? target
          : (width - gap * (row.length - 1)) / sumAspect;

        rowEl.style.height = height + "px";

        row.forEach(item => {
          if (isPartial) {
            item.el.style.flex = "0 0 auto";
            item.el.style.width = (item.aspect * height) + "px";
          } else {
            item.el.style.flex = item.aspect + " 1 0px";
            item.el.style.width = "";
          }
          rowEl.appendChild(item.el);
        });

        frag.appendChild(rowEl);
        row = [];
        sumAspect = 0;
      };

      items.forEach(item => {
        row.push(item);
        sumAspect += item.aspect;
        const height = (width - gap * (row.length - 1)) / sumAspect;
        if (height <= target) commit(false);
      });

      commit(true); // trailing row, if any - never dropped

      gallery.replaceChildren(frag);
    }

    // Build each tile once, then only re-flow on resize.
    items.forEach(item => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "gallery-item";
      btn.setAttribute("aria-label", `Open photo ${item.index + 1} of ${items.length}`);

      const img = document.createElement("img");
      img.src = item.thumb;
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";

      btn.appendChild(img);
      btn.addEventListener("click", () => open(item.index));
      item.el = btn;
    });

    layout();

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(layout, 120);
    });

    // ---- lightbox -------------------------------------------------------
    let current = -1;
    let lastFocused = null;

    function show(i) {
      current = (i + items.length) % items.length;
      lbImg.src = items[current].full;
      lbImg.alt = `Photo ${current + 1} of ${items.length}`;
      lbCount.textContent = `${current + 1} / ${items.length}`;

      // warm the neighbours so arrow-key browsing is instant
      [current + 1, current - 1].forEach(n => {
        const it = items[(n + items.length) % items.length];
        const pre = new Image();
        pre.src = it.full;
      });
    }

    function open(i) {
      lastFocused = document.activeElement;
      show(i);
      lightbox.classList.add("is-open");
      document.body.style.overflow = "hidden";
      lbClose.focus();
    }

    function close() {
      lightbox.classList.remove("is-open");
      lbImg.src = "";
      document.body.style.overflow = "";
      if (lastFocused && lastFocused.focus) lastFocused.focus();
    }

    const isOpen = () => lightbox.classList.contains("is-open");

    lbClose.addEventListener("click", close);
    lbPrev.addEventListener("click", () => show(current - 1));
    lbNext.addEventListener("click", () => show(current + 1));

    // click the backdrop to dismiss, but not the photo itself
    lightbox.addEventListener("click", e => {
      if (e.target === lightbox || e.target === lbImg) close();
    });

    document.addEventListener("keydown", e => {
      if (!isOpen()) return;
      if (e.key === "Escape")     { e.preventDefault(); close(); }
      if (e.key === "ArrowLeft")  { e.preventDefault(); show(current - 1); }
      if (e.key === "ArrowRight") { e.preventDefault(); show(current + 1); }
    });
  })();
  </script>
